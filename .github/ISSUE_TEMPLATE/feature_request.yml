name: 功能建议
description: 提出新能力或对现有工作流的改进
title: "enhancement: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: 相关能力
      options:
        - 文本视图
        - Flow 流程图
        - Focus / Black Box
        - Parking Dock
        - Android 小组件
        - 离线 / 同步
        - 备份 / 数据安全
        - 认证 / 会话
        - 部署 / 工具链
        - 跨能力 / 不确定
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题
      description: 说明当前工作流的阻碍，而不只描述想要的实现。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达成的结果
      description: 描述对使用者可见的成功标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方式或边界
      description: 例如离线、移动端、数据恢复、兼容性或维护成本。
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 影响检查
      options:
        - label: 该建议可能涉及个人数据、离线同步、备份恢复、认证、迁移或部署边界。
    validations:
      required: false
