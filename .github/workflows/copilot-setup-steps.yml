name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - package-lock.json

jobs:
  copilot-setup-steps:
    environment: copilot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure optional npm auth for private packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "::add-mask::$NPM_TOKEN"
            if ! npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" >/dev/null 2>&1; then
              echo "::error::Failed to configure npm authentication from NPM_TOKEN."
              exit 1
            fi
          else
            echo "NPM_TOKEN not configured; continuing without private npm package auth."
          fi

      - name: Restore Playwright browser cache (ubuntu-latest)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Bridge Supabase environment for MCP
        shell: bash
        env:
          COPILOT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          COPILOT_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          COPILOT_NG_APP_SUPABASE_URL: ${{ secrets.NG_APP_SUPABASE_URL }}
          COPILOT_NG_APP_SUPABASE_ANON_KEY: ${{ secrets.NG_APP_SUPABASE_ANON_KEY }}
        run: |
          supabase_url="${COPILOT_SUPABASE_URL:-${COPILOT_NG_APP_SUPABASE_URL:-}}"
          supabase_access_token="${COPILOT_SUPABASE_ACCESS_TOKEN:-}"

          if [ -z "$supabase_access_token" ] && [ -n "${COPILOT_NG_APP_SUPABASE_ANON_KEY:-}" ]; then
            supabase_access_token="${COPILOT_NG_APP_SUPABASE_ANON_KEY}"
            echo "::warning::SUPABASE_ACCESS_TOKEN not configured in the copilot environment; falling back to NG_APP_SUPABASE_ANON_KEY for Supabase MCP. This may be insufficient for privileged MCP operations."
          fi

          if [ -n "${COPILOT_NG_APP_SUPABASE_URL:-}" ]; then
            echo "NG_APP_SUPABASE_URL=${COPILOT_NG_APP_SUPABASE_URL}" >> "$GITHUB_ENV"
          fi

          if [ -n "${COPILOT_NG_APP_SUPABASE_ANON_KEY:-}" ]; then
            echo "::add-mask::${COPILOT_NG_APP_SUPABASE_ANON_KEY}"
            echo "NG_APP_SUPABASE_ANON_KEY=${COPILOT_NG_APP_SUPABASE_ANON_KEY}" >> "$GITHUB_ENV"
          fi

          if [ -n "$supabase_url" ]; then
            echo "SUPABASE_URL=$supabase_url" >> "$GITHUB_ENV"
          else
            echo "::warning::Neither SUPABASE_URL nor NG_APP_SUPABASE_URL is configured in the copilot environment; Supabase MCP will remain unavailable."
          fi

          if [ -n "$supabase_access_token" ]; then
            echo "::add-mask::$supabase_access_token"
            echo "SUPABASE_ACCESS_TOKEN=$supabase_access_token" >> "$GITHUB_ENV"
          else
            echo "::warning::Neither SUPABASE_ACCESS_TOKEN nor NG_APP_SUPABASE_ANON_KEY is configured in the copilot environment; Supabase MCP will remain unavailable."
          fi

          if [ -n "$supabase_url" ] && [ -n "$supabase_access_token" ]; then
            echo "Supabase MCP environment prepared."
          fi

      - name: Install dependencies
        run: |
          npm ci --prefer-offline || {
            echo "::warning::npm ci --prefer-offline failed; retrying npm ci without cache preference to rule out stale or incomplete cache."
            npm ci
          }

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Print environment info
        shell: bash
        run: |
          node --version
          npm --version
          npx playwright --version
