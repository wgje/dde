name: test-full-suite

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegraph-adapter-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Configure CodeGraph Adapter for CI
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/codegraph-ci.toml" <<'EOF'
          [mcp_servers.codegraph]
          command = "node"
          args = ["scripts/codegraph-nanoflow-mcp-stdio.cjs", "@colbymchenry/codegraph@1.6.2", "serve", "--mcp", "--path", "${workspaceFolder}"]
          startup_timeout_sec = 60.0
          tool_timeout_sec = 120.0

          [mcp_servers.codegraph.env]
          CODEGRAPH_DAEMON_IDLE_TIMEOUT_MS = "300000"
          CODEGRAPH_DAEMON_MAX_IDLE_MS = "1800000"
          CODEGRAPH_NO_DAEMON = "0"
          CODEGRAPH_NO_WATCH = "0"
          NANOFLOW_CODEGRAPH_CONTEXT_PACK_TIMEOUT_MS = "30000"
          NANOFLOW_CODEGRAPH_OVERLAY_QUERY_TIMEOUT_MS = "60000"
          NANOFLOW_CODEGRAPH_REFRESH_ON_STARTUP = "0"
          NANOFLOW_CODEGRAPH_STALE_WRAPPER_AUTO_RECYCLE = "0"
          EOF
          echo "NANOFLOW_CODEGRAPH_CODEX_CONFIG=$RUNNER_TEMP/codegraph-ci.toml" >> "$GITHUB_ENV"

      - name: Run CodeGraph Adapter Gate
        env:
          NANOFLOW_CODEGRAPH_GATE_LOG_DIR: ${{ runner.temp }}/codegraph-adapter-gate
        run: |
          set -eo pipefail
          npm run codegraph:adapter:gate

      - name: Upload CodeGraph Adapter Gate Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-adapter-gate-logs
          path: ${{ runner.temp }}/codegraph-adapter-gate/
          if-no-files-found: warn

  codegraph-read-identity-win32:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Test Environment
        run: npm run test:prepare-env

      - name: Build Trusted CodeGraph Read Identity Helper
        run: npm run codegraph:read-identity:build

      - name: Run CodeGraph Read Identity V1 Tests
        run: >-
          npx vitest run --config vitest.config.mts --no-file-parallelism --maxWorkers 1
          src/tests/scripts/codegraph-read-identity.spec.ts
          src/tests/scripts/codegraph-read-identity-win32.integration.spec.ts

  vitest-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Encoding Corruption Guard
        run: npm run quality:guard:encoding

      - name: Run Full Vitest Suite (Shard ${{ matrix.shard }}/4)
        run: |
          set -eo pipefail
          mkdir -p test-results
          npm run test:run:ci -- --shard=${{ matrix.shard }}/4 --timing-out=test-results/vitest-shard-${{ matrix.shard }}.json --vitest-json-out-dir=test-results/vitest-reports/shard-${{ matrix.shard }} | tee test-results/vitest-shard-${{ matrix.shard }}.log

      - name: Upload Shard Timing Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-${{ matrix.shard }}-timing
          path: |
            test-results/vitest-shard-${{ matrix.shard }}.json
            test-results/vitest-shard-${{ matrix.shard }}.log
            test-results/vitest-reports/shard-${{ matrix.shard }}/
          if-no-files-found: warn

  shard-balance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - vitest-full-suite

    steps:
      - name: Download Shard Timing Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-shard-*-timing
          path: test-results
          merge-multiple: true

      - name: Compute Shard Balance
        id: shard_balance
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const ROOT = path.join(process.cwd(), 'test-results');
          const FILE_RE = /vitest-shard-\d+\.json$/;
          const WARN_THRESHOLD = 1.4;
          const FAIL_THRESHOLD = 1.5;
          const FAIL_MAX_MEDIAN_THRESHOLD = 1.4;

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            const stack = [dir];
            while (stack.length > 0) {
              const current = stack.pop();
              const entries = fs.readdirSync(current, { withFileTypes: true });
              for (const entry of entries) {
                const absolute = path.join(current, entry.name);
                if (entry.isDirectory()) {
                  stack.push(absolute);
                  continue;
                }
                if (entry.isFile() && FILE_RE.test(path.basename(absolute))) {
                  out.push(absolute);
                }
              }
            }
            return out.sort();
          }

          function percentile50(values) {
            if (values.length === 0) return null;
            const sorted = [...values].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 === 1
              ? sorted[mid]
              : (sorted[mid - 1] + sorted[mid]) / 2;
          }

          const files = walk(ROOT);
          const durations = [];
          for (const file of files) {
            try {
              const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
              const duration = Number(parsed?.durationMs);
              if (Number.isFinite(duration) && duration > 0) {
                durations.push(duration);
              }
            } catch {
              // Ignore invalid JSON files.
            }
          }

          let status = 'pass';
          let maxMin = null;
          let maxMedian = null;

          if (durations.length < 2) {
            status = 'insufficient';
          } else {
            const min = Math.min(...durations);
            const max = Math.max(...durations);
            const median = percentile50(durations);
            maxMin = max / min;
            maxMedian = median ? max / median : null;
            if (maxMin >= FAIL_THRESHOLD && maxMedian !== null && maxMedian >= FAIL_MAX_MEDIAN_THRESHOLD) {
              status = 'fail';
            } else if (maxMin >= WARN_THRESHOLD) {
              status = 'warn';
            }
          }

          console.log(`[shard-balance] durations=${durations.join(',') || 'none'}`);
          console.log(`[shard-balance] max/min=${maxMin ?? 'n/a'} max/median=${maxMedian ?? 'n/a'} status=${status}`);

          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `max_min=${maxMin ?? ''}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `max_median=${maxMedian ?? ''}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `duration_count=${durations.length}\n`);
          }
          NODE

      - name: Warn On Pull Request Imbalance
        if: github.event_name == 'pull_request' && steps.shard_balance.outputs.status != 'pass'
        run: |
          echo "::warning::Shard balance is suboptimal (status=${{ steps.shard_balance.outputs.status }}, max/min=${{ steps.shard_balance.outputs.max_min }}, max/median=${{ steps.shard_balance.outputs.max_median }}). Target max/min < 1.4; hard failure requires max/min >= 1.5 and max/median >= 1.4."

      - name: Enforce Balance On Main Branches
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.shard_balance.outputs.status == 'fail'
        run: |
          echo "::error::Shard balance gate failed (status=${{ steps.shard_balance.outputs.status }}, max/min=${{ steps.shard_balance.outputs.max_min }}, max/median=${{ steps.shard_balance.outputs.max_median }}). Required: max/min < 1.5 or max/median < 1.4."
          exit 1

  update-duration-baseline:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - vitest-full-suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Download Shard Timing Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-shard-*-timing
          path: test-results
          merge-multiple: true

      - name: Update Test Duration Baseline
        run: |
          set -eo pipefail
          npm run test:baseline:update
          npm run test:quarantine:update

      - name: Upload Updated Baseline
        uses: actions/upload-artifact@v4
        with:
          name: test-duration-baseline-v2
          path: scripts/test-duration-baseline.json

      - name: Upload Updated Quarantine
        uses: actions/upload-artifact@v4
        with:
          name: test-quarantine-v2
          path: scripts/test-quarantine.json

  vitest-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Perf Vitest (Non-blocking)
        continue-on-error: true
        run: |
          set -eo pipefail
          mkdir -p test-results
          npm run test:perf | tee test-results/vitest-perf.log

      - name: Upload Perf Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-perf-log
          path: test-results/vitest-perf.log
          if-no-files-found: warn
